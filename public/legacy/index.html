/* ---- Focused exam room ---- */
body.exam-active{overflow:hidden}
.exam-shell{display:grid;grid-template-columns:minmax(0,1fr) 336px;width:100%;height:100dvh;min-height:0;overflow:hidden;background:#f4f6fb;color:#17233b}
.exam-main-scroll{height:100dvh;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:26px clamp(18px,3.2vw,52px) 48px}
.exam-main-inner{max-width:980px;margin:0 auto}
.exam-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 22px;border-bottom:1px solid #e1e7f0;margin-bottom:24px}
.exam-brand{font-size:.7rem;letter-spacing:.12em;font-weight:850;color:#315ee8}
.exam-header h1{font-size:clamp(1.15rem,2vw,1.55rem);letter-spacing:-.035em;margin:4px 0 0}
.exam-progress{min-width:120px;text-align:right;color:#53627d;font-size:.78rem}
.exam-progress strong{display:block;color:#17233b;font-size:1.05rem}
.exam-question-card{background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:clamp(20px,3vw,34px);box-shadow:0 8px 24px rgba(25,42,78,.04)}
.exam-question-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#53627d;font-size:.78rem;margin-bottom:20px}
.exam-question-meta strong{color:#315ee8;font-size:.82rem}
.exam-question-card .q{font-size:1.12rem;line-height:1.8;color:#17233b;margin:0 0 26px;white-space:pre-wrap;overflow-wrap:anywhere}
.exam-question-card .o{border:1px solid #e0e6f0;border-radius:12px;padding:13px 16px;margin:9px 0;background:#fff;transition:border-color .15s,background .15s;min-height:48px}
.exam-question-card .o.on{border-color:#315ee8;background:#f3f6ff;box-shadow:inset 0 0 0 1px #315ee8}
.exam-question-card .o:focus-visible,.exam-shell button:focus-visible{outline:3px solid rgba(49,94,232,.25);outline-offset:2px}
.exam-question-card .chip{border-radius:9px;background:#f7f9fc}
.exam-question-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #edf0f5;margin-top:28px;padding-top:18px}
.exam-question-actions .b{margin:0}
.exam-question-actions .b:disabled{opacity:.35;cursor:not-allowed}
.exam-sidebar{height:100dvh;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-left:1px solid #e1e7f0;padding:22px 20px 26px}
.exam-side-title{font-size:.7rem;letter-spacing:.13em;color:#53627d;font-weight:850;margin:2px 0 14px}
.exam-timer-card{border:1px solid #dfe6f2;border-radius:14px;padding:15px 16px;margin-bottom:12px;background:#f8faff}
.exam-timer-card small{display:block;color:#53627d;font-size:.69rem;font-weight:750;letter-spacing:.08em}
.exam-time-total{display:block;font-size:2rem;line-height:1.2;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#17233b;margin-top:5px}
.exam-time-question{display:block;font-size:1.35rem;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums;color:#315ee8;margin-top:5px}
.exam-timer-card.is-warning .exam-time-total{color:#b7791f}
.exam-timer-card.is-danger .exam-time-total{color:#b42318}
.exam-time-note{font-size:.68rem;color:#59677d;margin-top:6px}
.exam-sync-status{font-size:.72rem;line-height:1.5;padding:9px 11px;border-radius:9px;background:#edf7f1;color:#14734f;margin:14px 0}
.exam-sync-status.is-offline,.exam-sync-status.is-pending{background:#fff5e5;color:#93600c}
.exam-sync-status.is-error{background:#fff0ef;color:#b42318}
.exam-nav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}
.exam-nav-head b{font-size:.88rem}
.exam-nav-count{font-size:.72rem;color:#53627d}
.exam-filters{display:flex;gap:5px;margin-bottom:12px}
.exam-filters .b{flex:1;padding:7px 5px;font-size:.7rem;margin:0;border-radius:8px}
.exam-filters .b.active{background:#edf2ff;border-color:#315ee8;color:#244fc8}
.exam-nav-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.exam-nav-grid .nb{width:100%;height:38px;border-radius:9px;font-size:.78rem;font-weight:700}
.exam-nav-grid .nb.dn{background:#e7f7ef;border-color:#a7dfc4;color:#14734f}
.exam-nav-grid .nb.fg{border:2px solid #d99a32;background:#fff9ec;color:#9a640c}
.exam-nav-grid .nb.cur{outline:2px solid #315ee8;outline-offset:2px}
.exam-legend{display:flex;flex-wrap:wrap;gap:8px 13px;margin:13px 0;color:#53627d;font-size:.67rem}
.exam-legend span{display:inline-flex;align-items:center;gap:5px}
.exam-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:#fff;border:1px solid #cfd7e5}
.exam-legend i.answered{background:#e7f7ef;border-color:#a7dfc4}
.exam-legend i.flagged{background:#fff9ec;border:2px solid #d99a32}
.exam-legend i.current{outline:2px solid #315ee8;outline-offset:1px}
.exam-side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}
.exam-side-actions .b{margin:0;font-size:.8rem}
.exam-side-actions .submit-action{grid-column:1/-1;min-height:46px}
.exam-mobile-bar,.exam-mobile-sheet{display:none}
.exam-confirm-backdrop,.exam-lock-overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(12,24,48,.52);backdrop-filter:blur(5px)}
.exam-confirm-card,.exam-lock-card{width:min(100%,440px);background:#fff;border-radius:18px;padding:25px;box-shadow:0 24px 80px rgba(5,20,50,.25)}
.exam-confirm-card h2,.exam-lock-card h2{font-size:1.35rem;margin:0 0 8px;letter-spacing:-.03em}
.exam-confirm-card p,.exam-lock-card p{color:#43536d;font-size:.92rem;line-height:1.65}
.exam-confirm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.exam-confirm-stats div{padding:12px 8px;text-align:center;border-radius:10px;background:#f5f7fb}
.exam-confirm-stats strong{display:block;font-size:1.45rem}
.exam-confirm-stats span{font-size:.68rem;color:#53627d}
.exam-confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.exam-confirm-actions .b{margin:0}
.exam-lock-overlay{z-index:100;background:rgba(12,24,48,.68)}
.exam-lock-card{text-align:center}
.exam-lock-count{display:block;font-size:4rem;line-height:1.1;font-weight:900;letter-spacing:-.06em;color:#315ee8;font-variant-numeric:tabular-nums;margin:18px 0}
.exam-lock-card .m{font-size:.75rem}
.exam-empty-nav{font-size:.75rem;color:#59677d;text-align:center;padding:18px 4px}
.exam-network-note{font-size:.7rem;color:#53627d;line-height:1.5;margin-top:12px}
@media(max-width:900px){
 .exam-shell{display:block;height:100dvh}
 .exam-main-scroll{height:100dvh;padding:18px 15px 112px}

    function ensureAttemptReady(a){
      const x=ex(view.id);
      if(!a||!x||!Array.isArray(x.qs)||!x.qs.length)return false;
      const n=x.qs.length,oldIds=Array.isArray(a.qids)?a.qids:[];
      const oldAns=Array.isArray(a.ans)?a.ans:[],oldTimes=Array.isArray(a.t)?a.t:[],oldFlags=Array.isArray(a.fl)?a.fl:[];
      const sameOrder=oldIds.length===n&&x.qs.every((q,i)=>q&&oldIds[i]===q.id);
      if(sameOrder&&oldAns.length===n&&oldTimes.length===n&&oldFlags.length===n){
        a.qids=x.qs.map(q=>q.id);
      }else{
        const previous=new Map(oldIds.map((id,i)=>[id,{answer:oldAns[i]??null,time:Number(oldTimes[i])||0,flag:!!oldFlags[i]}]));
        a.ans=x.qs.map((q,i)=>previous.has(q.id)?previous.get(q.id).answer:(oldAns[i]??null));
        a.t=x.qs.map((q,i)=>Math.max(0,previous.has(q.id)?previous.get(q.id).time:(Number(oldTimes[i])||0)));
        a.fl=x.qs.map((q,i)=>previous.has(q.id)?previous.get(q.id).flag:!!oldFlags[i]);
        a.qids=x.qs.map(q=>q.id);
      }
      const cursor=Number(a.cur);
      a.cur=Number.isFinite(cursor)?Math.min(n-1,Math.max(0,Math.floor(cursor))):0;
      return !!x.qs[a.cur];
    }
    function installAttemptExam(a,exam){
      if(!exam||!Array.isArray(exam.questions)||!exam.questions.length)return false;
      const qs=exam.questions.map(q=>({id:q.id,k:q.type,q:q.content?.q||'',o:q.content?.o||[],p:Number(q.points)||1,t:q.content?.t||'',once:!!q.content?.once}));
      if(qs.some(q=>!q.id||!q.q))return false;
      const previous=new Map((a.qids||[]).map((id,i)=>[id,{answer:a.ans?.[i]??null,time:Number(a.t?.[i])||0,flag:!!a.fl?.[i]}]));
      a.ans=qs.map((q,i)=>previous.has(q.id)?previous.get(q.id).answer:(a.ans?.[i]??null));
      a.t=qs.map((q,i)=>Math.max(0,previous.has(q.id)?previous.get(q.id).time:(Number(a.t?.[i])||0)));
      a.fl=qs.map((q,i)=>previous.has(q.id)?previous.get(q.id).flag:!!a.fl?.[i]);
      a.qids=qs.map(q=>q.id);a.examSnapshot=exam;
      const item={id:exam.id,title:exam.title,desc:exam.description||'',minutes:Number(exam.duration_minutes)||60,qs,exam_id:exam.exam_id,version_no:exam.version_no};
      D.exams=D.exams.filter(x=>x.id!==exam.id);D.exams.push(item);
      const cursor=Number(a.cur);a.cur=Number.isFinite(cursor)?Math.min(qs.length-1,Math.max(0,Math.floor(cursor))):0;
      return true;
    }
    let resumeAttemptPromise=null;
    async function resumeAttempt(){
      if(resumeAttemptPromise)return resumeAttemptPromise;
      if(view.n!=='take'||!view.at)return;
      const a=view.at;
      lap(a);
      a.resuming=true;
      resumeAttemptPromise=(async()=>{
        try{
          if(!ensureAttemptReady(a)){
            let exam=a.examSnapshot;
            if(!exam||!Array.isArray(exam.questions)||!exam.questions.length){
              const {data,error}=await sb.rpc('get_published_exam',{p_exam_version_id:a.examVersionId});
              if(error)throw error;exam=data;
            }
            if(!installAttemptExam(a,exam)||!ensureAttemptReady(a))throw new Error('Không khôi phục được danh sách câu hỏi của lượt thi này.');
          }
          if(navigator.onLine){
            const ok=await refreshAttemptState(a);
            if(!ok)return;
            await syncPending(a);
          }else{a.offlineMode=true}
          if(view.n==='take'&&view.at===a){
            ensureAttemptReady(a);a.l=performance.now();a.lastFlush=performance.now();
            persistAttempt(a);updateTimeUI(a);updateSyncStatus(a);render();
          }
        }catch(err){

    async function flushTime(a,index,visit){

      if(index===a.cur)a.pendingTime=0;
      let first=true;
      while(seconds>0||first&&visit){
        const chunk=Math.min(300,seconds);
        a.timeQueue.push({id:makeUuid(),index,seconds:chunk,visit:first?(visit||0):0});
        seconds-=chunk;first=false;
      }
      persistAttempt(a);await syncPending(a);
    }

    function buildAttempt(exam,attemptId,state,cached,offline=false,pointer=null){

      (state.question_times||[]).forEach(item=>{const i=qs.findIndex(q=>q.id===item.exam_version_question_id);if(i>=0)times[i]=Number(item.seconds_spent)||0});
      if(cached?.ans?.length===qs.length)cached.ans.forEach((v,i)=>{ans[i]=v});
      if(cached?.t?.length===qs.length)cached.t.forEach((v,i)=>{times[i]=Math.max(times[i]||0,Number(v)||0)});
      const startAt=new Date(state.started_at||pointer?.stateSnapshot?.started_at).getTime();
      const duration=Number(state.duration_minutes||pointer?.stateSnapshot?.duration_minutes)||Number(exam.duration_minutes);

      const a={
        attemptId,examVersionId:exam.id,userId:profile?.id||pointer?.userId||null,
        qids:qs.map(q=>q.id),start:startAt,end:deadline,deadlineAt:deadline,
        autoSubmitAt:Date.parse(state.auto_submit_at||pointer?.autoSubmitAt)||(deadline+10000),
        serverNowAtSync:offline?serverNowAtSync+Math.max(0,Date.now()-(pointer?.savedAt||Date.now())):serverNowAtSync,
        serverPerf:performance.now(),ans,fl:cached?.fl?.length===qs.length?cached.fl:Array(qs.length).fill(false),
        t:times,cur:Math.min(qs.length-1,Math.max(0,Number(cached?.cur)||0)),
        l:performance.now(),pendingTime:Number(cached?.pendingTime)||0,
        lastFlush:performance.now(),dirtyAnswers:cached?.dirtyAnswers||{},timeQueue:cached?.timeQueue||[],

    function importAnswerValue(q){
      const a=q.answer_key,k=q.question_type,opts=Array.isArray(q.content?.o)?q.content.o:[];
      if(a==null)return null;
      if(k==='mc'){if(typeof a==='string'&&/^[A-F]$/i.test(a.trim()))return 'ABCDEF'.indexOf(a.trim().toUpperCase());if(Number.isInteger(a)&&a>=0&&a<opts.length)return a;return null}
      if(k==='ms'){const arr=Array.isArray(a)?a:null;if(!arr)return null;const vals=arr.map(x=>typeof x==='string'&&/^[A-F]$/i.test(x.trim())?'ABCDEF'.indexOf(x.trim().toUpperCase()):Number.isInteger(x)&&x>=0&&x<opts.length?x:null);return vals.length>0&&vals.every(x=>x!==null)?[...new Set(vals)].sort((x,y)=>x-y):null}
      if(k==='tf'){if(!Array.isArray(a)||opts.length<2||a.length!==opts.length)return null;const vals=a.map(x=>typeof x==='boolean'?x:/^(đ|d|đúng|true)$/i.test(String(x))?true:/^(s|sai|false)$/i.test(String(x))?false:null);return vals.every(x=>x!==null)?vals:null}
      if(k==='num'){const raw=String(a).trim();if(!raw)return null;const n=Number(raw.replace(',','.'));return Number.isFinite(n)?n:null}
      if(k==='dnd'){
        let pairs=a;
        if(typeof a==='string'){const parsed=pairsX(a);if(!parsed)return null;pairs=parsed.mp}
        if(!pairs||typeof pairs!=='object'||Array.isArray(pairs))return null;
        const mapped={};
        for(const [slot,value] of Object.entries(pairs)){
          const raw=String(value).trim();
          let hits=opts.map((o,i)=>normAns(o)===normAns(raw)?i+1:null).filter(x=>x!==null);
          if(hits.length===0&&/^\d+$/.test(raw)&&Number(raw)>=1&&Number(raw)<=opts.length)hits=[Number(raw)];
          if(hits.length!==1||!/^\d+$/.test(slot)||Number(slot)<1)return null;
          mapped[slot]=hits[0];
        }
        return Object.keys(mapped).length?mapped:null;
      }
      return null;
    }

        else if(k==='importReject'){const {error}=await sb.from('import_questions').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',id).eq('job_id',activeImportJob.id);if(error)throw error;await openImportJob(activeImportJob.id)}
        else if(k==='importToEditor')await importToEditor();
        else return;
      }catch(err){importUiMessage=err.message||String(err);notify('Trung tâm nhập đề: '+importUiMessage);const m=document.getElementById('import-msg');if(m)m.textContent=importUiMessage}
    });

    const __tsaLegacyBoot=boot;
    boot=async function(){
      await __tsaLegacyBoot();
      const requestedStart=new URLSearchParams(window.location.search).get('start');
      if(requestedStart&&profile?.status==='active')await start(requestedStart);
    };
    boot();
    </script></body></html>
