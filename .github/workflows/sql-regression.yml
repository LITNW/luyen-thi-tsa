name: SQL migration regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/sql-regression.yml'

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tsa_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated schema fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/answer_validation_schema.sql
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
      - name: Run SQL regression tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/answer_validation_regression.sql
