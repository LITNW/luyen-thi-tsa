name: Supabase clean-install compatibility

on:
  push:
    branches: [feature/m1-subject-taxonomy-stimuli, feature/exam-categories-admin, feature/exam-category-editor-integration]
  pull_request:
    branches: [main, architecture/multi-subject-foundation, feature/exam-categories-admin]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/migration-recovery-manifest.json'
      - '.github/workflows/supabase-clean-install.yml'

jobs:
  clean-supabase-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        run: |
          npm install --global supabase@3.0.0
          supabase --version

      - name: Initialize an isolated Supabase project
        run: |
          mkdir -p /tmp/tsa-supabase-clean
          cd /tmp/tsa-supabase-clean
          supabase init

      - name: Start clean Supabase services
        working-directory: /tmp/tsa-supabase-clean
        run: supabase start -x studio,edge-runtime,logflare,vector,mailpit,imgproxy,realtime,postgres-meta

      - name: Apply reconstructed pre-005 public baseline to Supabase Auth/Storage
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/pre_005_supabase_schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert$
          BEGIN
            IF to_regclass('auth.users') IS NULL OR to_regclass('storage.objects') IS NULL THEN
              RAISE EXCEPTION 'Supabase Auth or Storage schema is missing from the clean stack.';
            END IF;
            IF to_regprocedure('auth.uid()') IS NULL THEN
              RAISE EXCEPTION 'Supabase auth.uid() is missing.';
            END IF;
          END;
          $assert$;
          SQL

      - name: Apply all recovered Production migrations in ledger order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Applying $file"
            if [[ "$file" == 20261111145753_* ]]; then
              sed 's/SET_ADMIN_EMAIL_BEFORE_APPLY/ci-admin@example.test/g' "supabase/migrations/$file" > /tmp/recovered-bootstrap.sql
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f /tmp/recovered-bootstrap.sql
            else
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "supabase/migrations/$file"
            fi
          done < <(jq -r '.migrations[] | "\(.version)_\(.name).sql"' supabase/migration-recovery-manifest.json)

      - name: Apply subsequent AI import migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112050000_ai_exam_import_staging.sql

      - name: Verify recovered migration chain
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/recovered_migration_chain_smoke.sql

      - name: Verify merged answer-validation migration and regression test
        run: |
          test -s supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
          test -s supabase/tests/answer_validation_regression.sql

      - name: Apply centralized answer-validation migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112170000_centralize_exam_answer_validation.sql

      - name: Apply M1 subject/taxonomy/stimulus foundation migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_m1_subject_taxonomy_stimuli.sql

      - name: Apply M2 exam category migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_exam_categories_admin.sql
      - name: Apply M2 follow-up for archived category preservation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113140000_exam_category_archived_assignment_preservation.sql
      - name: Apply M2 follow-up for archived version listing
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113150000_exam_category_admin_list_archived_version_filter.sql

      - name: Apply education hierarchy foundation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155228_education_hierarchy_foundation.sql
      - name: Apply education hierarchy active-profile read policies
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155356_education_hierarchy_active_profile_read_policies.sql
      - name: Apply education hierarchy identity guards
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155742_education_hierarchy_identity_guards.sql
      - name: Apply education exam placement and scoped catalogue
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113160130_education_exam_placement_and_scoped_catalogue.sql
      - name: Apply education exam placement history guard
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113160231_education_exam_placement_identity_guard.sql
      - name: Apply atomic education-aware editor save
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113161654_education_atomic_editor_save.sql
      - name: Enforce education placement for every publication path
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114024035_education_exam_version_publish_guard.sql

      - name: Seed isolated test admin and run answer-validation regression
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id,email,email_confirmed_at,raw_user_meta_data)
          VALUES (
            '00000000-0000-4000-8000-000000000001',
            'ci-admin@example.test',
            now(),
            '{"display_name":"CI Admin"}'::jsonb
          );
          UPDATE public.profiles
          SET role='admin', status='active'
          WHERE id='00000000-0000-4000-8000-000000000001';
          DO $assert$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.profiles
              WHERE id='00000000-0000-4000-8000-000000000001'
                AND role='admin' AND status='active'
            ) THEN
              RAISE EXCEPTION 'Could not seed isolated test admin.';
            END IF;
          END;
          $assert$;
          SQL
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/answer_validation_regression.sql

      - name: Run legacy exam RPC contract regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/legacy_exam_contract_regression.sql

      - name: Run M1 subject/taxonomy/stimulus regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/m1_subject_taxonomy_stimuli_regression.sql

      - name: Run M2 exam category regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/exam_categories_admin_regression.sql

      - name: Run education hierarchy foundation regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/education_hierarchy_foundation_regression.sql

      - name: Run education exam placement regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/education_exam_placement_regression.sql

      - name: Run atomic education-aware editor save regression
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/education_atomic_editor_save_regression.sql

      - name: Stop clean Supabase services
        if: always()
        working-directory: /tmp/tsa-supabase-clean
        run: supabase stop --no-backup
