name: Integrated recovered-chain answer validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/fixtures/pre_005_schema.sql'
      - 'supabase/migration-recovery-manifest.json'
      - 'supabase/tests/recovered_migration_chain_smoke.sql'
      - '.github/workflows/integrated-answer-validation.yml'

jobs:
  apply-recovered-chain-and-answer-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsa_integrated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsa_integrated_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tsa_integrated_test
    steps:
      - name: Checkout migration recovery branch
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create reconstructed pre-005 schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/pre_005_schema.sql
      - name: Apply all 17 recovered Production migrations
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/$file"
          done < <(jq -r '.migrations[] | "\(.version)_\(.name).sql"' supabase/migration-recovery-manifest.json)
      - name: Fetch the reviewed answer-validation PR
        run: |
          git fetch --no-tags origin fix/exam-answer-validation-guard
          git show FETCH_HEAD:supabase/migrations/20261112170000_centralize_exam_answer_validation.sql > /tmp/answer-validation.sql
          git show FETCH_HEAD:supabase/tests/answer_validation_regression.sql > /tmp/answer-validation-regression.sql
      - name: Apply answer-validation migration on top of recovered chain
        run: psql -v ON_ERROR_STOP=1 -f /tmp/answer-validation.sql
      - name: Seed a test-only Admin identity
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id,email,email_confirmed_at,raw_user_meta_data)
          VALUES (
            '00000000-0000-4000-8000-000000000001',
            'ci-admin@example.test',
            now(),
            '{"display_name":"CI Admin"}'::jsonb
          );
          UPDATE public.profiles
          SET role='admin', status='active'
          WHERE id='00000000-0000-4000-8000-000000000001';
          DO $assert$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.profiles
              WHERE id='00000000-0000-4000-8000-000000000001'
                AND role='admin' AND status='active'
            ) THEN
              RAISE EXCEPTION 'Could not seed the test-only Admin profile.';
            END IF;
          END;
          $assert$;
          SQL
      - name: Run answer-validation regression suite
        run: psql -v ON_ERROR_STOP=1 -f /tmp/answer-validation-regression.sql
