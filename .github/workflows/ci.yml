name: React migration CI

on:
  pull_request:
    branches: [main, feature/exam-categories-admin]
  push:
    branches: [feature/react-migration, feature/exam-categories-admin, feature/exam-category-editor-integration]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
