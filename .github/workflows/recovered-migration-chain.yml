name: Recovered migration chain smoke test

on:
  push:
    branches: [feature/m1-subject-taxonomy-stimuli, feature/exam-categories-admin, feature/exam-category-editor-integration]
  pull_request:
    branches: [main, architecture/multi-subject-foundation, feature/exam-categories-admin]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/migration-recovery-manifest.json'
      - '.github/workflows/recovered-migration-chain.yml'

jobs:
  apply-recovered-chain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsa_chain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsa_chain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tsa_chain_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create reconstructed pre-005 schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/pre_005_schema.sql
      - name: Apply all 17 recovered Production migrations in order
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/$file"
          done < <(jq -r '.migrations[] | "\(.version)_\(.name).sql"' supabase/migration-recovery-manifest.json)
      - name: Verify recovered schema and RPCs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/recovered_migration_chain_smoke.sql
      - name: Verify merged answer-validation migration and regression test
        run: |
          test -s supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
          test -s supabase/tests/answer_validation_regression.sql
      - name: Apply centralized answer-validation migration after recovered chain
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
      - name: Apply M1 subject/taxonomy/stimulus foundation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_m1_subject_taxonomy_stimuli.sql
      - name: Apply M2 exam category migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_exam_categories_admin.sql
      - name: Apply M2 follow-up for archived category preservation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113140000_exam_category_archived_assignment_preservation.sql
      - name: Seed a test-only Admin identity
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id,email,email_confirmed_at,raw_user_meta_data)
          VALUES (
            '00000000-0000-4000-8000-000000000001',
            'ci-admin@example.test',
            now(),
            '{"display_name":"CI Admin"}'::jsonb
          );
          UPDATE public.profiles
          SET role='admin', status='active'
          WHERE id='00000000-0000-4000-8000-000000000001';
          DO $assert$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.profiles
              WHERE id='00000000-0000-4000-8000-000000000001'
                AND role='admin' AND status='active'
            ) THEN
              RAISE EXCEPTION 'Could not seed the test-only Admin profile.';
            END IF;
          END;
          $assert$;
          SQL
      - name: Run answer-validation regression suite on recovered schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/answer_validation_regression.sql

      - name: Run M1 subject/taxonomy/stimulus regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/m1_subject_taxonomy_stimuli_regression.sql

      - name: Run M2 exam category regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/exam_categories_admin_regression.sql
