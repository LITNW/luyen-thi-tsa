name: Recovered migration chain smoke test

on:
  push:
    branches: [feat/**, feature/**]
  pull_request:
    branches: [main, architecture/multi-subject-foundation, feature/exam-categories-admin]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/migration-recovery-manifest.json'
      - '.github/workflows/recovered-migration-chain.yml'

jobs:
  apply-recovered-chain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsa_chain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsa_chain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tsa_chain_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create reconstructed pre-005 schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/pre_005_schema.sql
      - name: Create isolated Storage schema fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/storage_schema.sql
      - name: Apply all 17 recovered Production migrations in order
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/$file"
          done < <(jq -r '.migrations[] | "\(.version)_\(.name).sql"' supabase/migration-recovery-manifest.json)
      - name: Verify recovered schema and RPCs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/recovered_migration_chain_smoke.sql
      - name: Apply recovered Production AI import migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112050000_ai_exam_import_staging.sql
      - name: Verify merged answer-validation migration and regression test
        run: |
          test -s supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
          test -s supabase/tests/answer_validation_regression.sql
      - name: Apply centralized answer-validation migration after recovered chain
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112170000_centralize_exam_answer_validation.sql
      - name: Apply M1 subject/taxonomy/stimulus foundation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_m1_subject_taxonomy_stimuli.sql
      - name: Apply M2 exam category migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_exam_categories_admin.sql
      - name: Apply M2 follow-up for archived category preservation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113140000_exam_category_archived_assignment_preservation.sql
      - name: Apply M2 follow-up for archived version listing
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113150000_exam_category_admin_list_archived_version_filter.sql
      - name: Apply education hierarchy foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155228_education_hierarchy_foundation.sql
      - name: Allow multiple offerings per canonical subject
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119130000_allow_multiple_offerings_per_catalogue_subject.sql
      - name: Apply education knowledge-group classification
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119150000_add_education_knowledge_groups.sql
      - name: Apply education hierarchy active-profile read policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155356_education_hierarchy_active_profile_read_policies.sql
      - name: Apply education hierarchy identity guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113155742_education_hierarchy_identity_guards.sql
      - name: Apply education exam placement and scoped catalogue
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113160130_education_exam_placement_and_scoped_catalogue.sql
      - name: Apply education exam placement history guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113160231_education_exam_placement_identity_guard.sql
      - name: Apply atomic education-aware editor save
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113161654_education_atomic_editor_save.sql
      - name: Enforce education placement for every publication path
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114024035_education_exam_version_publish_guard.sql
      - name: Apply question media and shared stimulus migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115150336_question_media_stimulus_groups.sql
      - name: Apply stimulus RPC invoker hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115150434_stimulus_rpc_invoker_hardening.sql
      - name: Apply question media validator grants migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115150559_question_media_validator_grants.sql
      - name: Apply multiple independent stimulus groups migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115154958_multiple_stimulus_groups.sql
      - name: Apply archive-only exam version RPC migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116033209_archive_exam_versions_without_physical_deletion.sql
      - name: Exclude archived exams from published payload and media access
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118032350_exclude_archived_exam_media.sql
      - name: Seed a test-only Admin identity
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id,email,email_confirmed_at,raw_user_meta_data)
          VALUES (
            '00000000-0000-4000-8000-000000000001',
            'ci-admin@example.test',
            now(),
            '{"display_name":"CI Admin"}'::jsonb
          );
          UPDATE public.profiles
          SET role='admin', status='active'
          WHERE id='00000000-0000-4000-8000-000000000001';
          DO $assert$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.profiles
              WHERE id='00000000-0000-4000-8000-000000000001'
                AND role='admin' AND status='active'
            ) THEN
              RAISE EXCEPTION 'Could not seed the test-only Admin profile.';
            END IF;
          END;
          $assert$;
          SQL
      - name: Run archive-only exam version regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/archive_exam_versions_without_physical_deletion_regression.sql

      - name: Run answer-validation regression suite on recovered schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/answer_validation_regression.sql

      - name: Run M1 subject/taxonomy/stimulus regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/m1_subject_taxonomy_stimuli_regression.sql

      - name: Run M2 exam category regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/exam_categories_admin_regression.sql

      - name: Run education hierarchy foundation regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/education_hierarchy_foundation_regression.sql

      - name: Run education exam placement regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/education_exam_placement_regression.sql

      - name: Run atomic education-aware editor save regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/education_atomic_editor_save_regression.sql
      - name: Run question media and shared stimulus regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/question_media_stimulus_regression.sql
      - name: Run multiple independent stimulus groups regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/multiple_stimulus_groups_regression.sql
