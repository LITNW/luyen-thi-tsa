    async function docxText(f){const b=new Uint8Array(await f.arrayBuffer()),v=new DataView(b.buffer);let e=b.length-22,xml=null,img=0;

    p+=46+m+x+c}

    const PQ='Bạn là công cụ trích xuất ĐỀ BÀI từ tài liệu thi. Trích CHÍNH XÁC (không sửa, không dịch, không tự giải) và trả về DUY NHẤT một JSON dạng {qs:[{n,k,q,o,a,t,img,once,fm}]}. n = số câu in trong đề. k = mc (trắc nghiệm 1 đáp án) | ms (chọn nhiều đáp án đúng; đề thường ghi «chọn tất cả», «chọn các khẳng định đúng») | tf (đúng/sai) | num (điền số) | dnd (GHÉP NỐI). Câu ghép nối (dnd) có các vị trí cần ghép đánh dấu [1], [2], [3]… trong nội dung và một danh sách phương án được đánh số 1, 2, 3, …; đây KHÔNG phải mc dù có nhiều phương án. Với dnd: giữ nguyên các dấu [n] trong q; o là danh sách phương án theo đúng thứ tự số 1, 2, 3… (không kèm số thứ tự; tối đa 6 phương án, có thể có 1–3 phương án nhiễu không dùng đến; số vị trí không nhất thiết bằng số phương án; nếu nội dung phương án chứa ký hiệu | thì giữ nguyên trong chuỗi); không nhầm số thứ tự phương án với số câu; once = true CHỈ khi đề nêu rõ mỗi phương án chỉ dùng một lần, không thì bỏ qua. Với mc và ms: o là các phương án không kèm A./B.. Với tf: o là các ý a) b) c) d) không kèm ký hiệu. Với num: o là mảng rỗng. q là nội dung câu, không gồm chữ «Câu 1». t = chủ đề nếu có. img = true nếu câu cần hình vẽ hoặc bảng không viết được bằng chữ. BỎ QUA mọi bảng đáp án và lời giải. Chỉ điền a (đúng như viết) khi đáp án in ngay trong câu hỏi, còn lại để null. TUYỆT ĐỐI không đoán hay tự tính đáp án. CÔNG THỨC TOÁN: chỉ chuyển những đoạn thực sự là công thức toán sang LaTeX, đặt trong $...$ (nội dòng) hoặc $$...$$ (đứng riêng một dòng); chữ thường giữ nguyên, không đưa cả câu vào LaTeX. Nếu tài liệu đã có sẵn công thức trong $...$ hoặc $$...$$ thì giữ nguyên từng ký tự. Mỗi công thức viết trên một dòng, không xuống dòng bên trong $...$. Dùng \\frac, \\sqrt, ^, _, \\int_a^b, \\lim_{x\\to a}, \\sum, \\begin{pmatrix}...\\end{pmatrix}, \\begin{vmatrix}...\\end{vmatrix}, \\begin{cases}...\\end{cases}, \\overrightarrow{AB}, \\angle, \\perp, \\parallel, \\triangle, \\left|...\\right|, \\in, \\subset, \\cup, \\cap. Dấu     async function imp(){const ms=document.getElementById('im'),files=[...document.getElementById('fi').files];if(!files.length){ms.textContent='Hãy chọn tệp DOCX, PDF hoặc TXT.';return}try{IW=[];FMETA={};SRC=[];QL=[];const out=[];for(const f of files){const n=f.name.toLowerCase();if(n.endsWith('.docx'))out.push(await docxText(f));else if(n.endsWith('.pdf'))out.push(await pdfText(f));else if(n.endsWith('.txt'))out.push(await f.text());else throw new Error(f.name+': định dạng này chưa hỗ trợ trích xuất văn bản.')}document.getElementById('f-q').value=out.join('\n\n---\n\n');ms.textContent='Đã trích xuất văn bản. Hãy rà soát cấu trúc câu, phương án, đáp án và công thức trước khi lưu.';document.getElementById('iw').innerHTML=IW.map(x=>'<p class="m">⚠ '+esc(x)+'</p>').join('');fpanel()}catch(e){ms.textContent='Lỗi trích xuất: '+e.message}}

    A.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a,i=b.dataset.i,a=view.at;
      try{
        if(k==='login')await login();
        else if(k==='signup')await signup();
        else if(k==='signout'){await sb.auth.signOut();profile=null;me=false;D.exams=[];go({n:'auth'})}
        else if(k==='bootstrap')await bootstrapAdmin();
        else if(k==='home'){if(profile)go({n:'home'});else go({n:'auth'})}
        else if(k==='profile')go({n:'profilePage'});
        else if(k==='history')await loadHistory();
        else if(k==='users')await loadUsers();
        else if(k==='attempts')await loadAdminAttempts();
        else if(k==='new')go({n:'edit',id:null,exam_id:null,exam:{title:'',desc:'',minutes:60,qs:[]},questions:[]});
        else if(k==='editVersion')await openEditor(i,b.dataset.status,b.dataset.exam);
        else if(k==='createVersion'){const {data:id,error}=await sb.rpc('admin_create_exam_version',{p_exam_id:b.dataset.exam});if(error)throw error;await openEditor(id,'draft',b.dataset.exam)}
        else if(k==='saveDraft')await save(false);
        else if(k==='publishDraft')await save(true);
        else if(k==='imp')await imp();
        else if(k==='fchk')fpanel();
        else if(k==='start')await start(i);
        else if(k==='toggleRole'){const p=adminProfiles.find(x=>x.id===i);await updateProfile(i,p.role==='admin'?'student':'admin',p.status)}
        else if(k==='toggleStatus'){const p=adminProfiles.find(x=>x.id===i);await updateProfile(i,p.role,p.status==='active'?'suspended':'active')}
        else if(k==='sub')view.cf=true;
        else if(k==='no')view.cf=false;
        else if(k==='yes'){await finish();return}
        else if(k==='pick'){a.ans[a.cur]=+i;await saveCurrentAnswer(a)}
        else if(k==='tf'){const q=ex(view.id).qs[a.cur],f=a.ans[a.cur]||Array(q.o.length).fill(null);f[+i]=b.dataset.v==='1';a.ans[a.cur]=f;await saveCurrentAnswer(a)}
        else if(k==='ms'){const s0=new Set(a.ans[a.cur]||[]);if(s0.has(+i))s0.delete(+i);else s0.add(+i);a.ans[a.cur]=[...s0].sort((x,y)=>x-y);await saveCurrentAnswer(a)}
        else if(k==='chip'){sel=sel===+i?null:+i;render();return}
        else if(k==='slot'){await place(+i);return}
        else if(k==='flag')a.fl[a.cur]=!a.fl[a.cur];
        else if(k==='prev'||k==='next'||k==='jump'){lap(a);await flushTime(a,a.cur,0).catch(()=>{});a.cur=k==='jump'?+i:a.cur+(k==='next'?1:-1);await flushTime(a,a.cur,1).catch(()=>{});a.l=Date.now();a.lastFlush=Date.now()}
        if(view.n==='take'){render();return}
        if(k==='sub'||k==='no')render();
      }catch(err){notify(err.message||String(err))}
    });
    A.addEventListener('change',async e=>{const t=e.target;if(t.id==='nm'&&view.n==='take'){view.at.ans[view.at.cur]=t.value;try{await saveCurrentAnswer(view.at)}catch(err){notify('Không lưu được đáp án: '+err.message)}}if(t.classList&&t.classList.contains('fxi'))fedit(+t.dataset.k,t.value)});
    A.addEventListener('dragstart',e=>{const b=e.target.closest('[data-a="chip"]');if(b){sel=+b.dataset.i;e.dataTransfer.setData('text/plain','x')}});
    A.addEventListener('dragover',e=>{if(e.target.closest('[data-a="slot"]'))e.preventDefault()});
    A.addEventListener('drop',e=>{const s=e.target.closest('[data-a="slot"]');if(s){e.preventDefault();place(+s.dataset.i)}});
    boot();
    </script></body></html>
