ÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"(-\\infty; -1)","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"(3; +\\infty)","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"(3; 4)","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"y = x - 1","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"y' > 0 \\Leftrightarrow x \u003c 1 - \\sqrt{3}","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"x > 1 + \\sqrt{3}","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"1-\\sqrt{3}","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"y'(3) \\neq 0","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"},{"tex":"\\lim_{x \\to \\infty} y - (x-1) = \\lim \\frac{3}{x-1} = 0","st":"ai","raw":null,"src":"đoạn 1/4 của BỘ ĐỀ THI DỰ ĐOÁN ĐÁNH GIÁ TƯ DUY (TSA 2026-2027) - PHẦN TƯ DUY TOÁN HỌC.docx","warn":null,"chk":"đã render"}]},{"k":"num","q":"Một chiếc thùng chứa công nghiệp hình trụ không có nắp đậy, thể tích cố định $V = 64\\pi \\text{ dm}^3$. Bán kính đáy $r$ (decimét) của thùng bằng bao nhiêu để diện tích vật liệu dùng để chế tạo thùng (gồm diện tích xung quanh và diện tích đáy) đạt giá t     const PQ='Bạn là công cụ trích xuất ĐỀ BÀI từ tài liệu thi. Trích CHÍNH XÁC (không sửa, không dịch, không tự giải) và trả về DUY NHẤT một JSON dạng {qs:[{n,k,q,o,a,t,img,once,fm}]}. n = số câu in trong đề. k = mc (trắc nghiệm 1 đáp án) | ms (chọn nhiều đáp án đúng; đề thường ghi «chọn tất cả», «chọn các khẳng định đúng») | tf (đúng/sai) | num (điền số) | dnd (GHÉP NỐI). Câu ghép nối (dnd) có các vị trí cần ghép đánh dấu [1], [2], [3]… trong nội dung và một danh sách phương án được đánh số 1, 2, 3, …; đây KHÔNG phải mc dù có nhiều phương án. Với dnd: giữ nguyên các dấu [n] trong q; o là danh sách phương án theo đúng thứ tự số 1, 2, 3… (không kèm số thứ tự; tối đa 6 phương án, có thể có 1–3 phương án nhiễu không dùng đến; số vị trí không nhất thiết bằng số phương án; nếu nội dung phương án chứa ký hiệu | thì giữ nguyên trong chuỗi); không nhầm số thứ tự phương án với số câu; once = true CHỈ khi đề nêu rõ mỗi phương án chỉ dùng một lần, không thì bỏ qua. Với mc và ms: o là các phương án không kèm A./B.. Với tf: o là các ý a) b) c) d) không kèm ký hiệu. Với num: o là mảng rỗng. q là nội dung câu, không gồm chữ «Câu 1». t = chủ đề nếu có. img = true nếu câu cần hình vẽ hoặc bảng không viết được bằng chữ. BỎ QUA mọi bảng đáp án và lời giải. Chỉ điền a (đúng như viết) khi đáp án in ngay trong câu hỏi, còn lại để null. TUYỆT ĐỐI không đoán hay tự tính đáp án. CÔNG THỨC TOÁN: chỉ chuyển những đoạn thực sự là công thức toán sang LaTeX, đặt trong $...$ (nội dòng) hoặc $$...$$ (đứng riêng một dòng); chữ thường giữ nguyên, không đưa cả câu vào LaTeX. Nếu tài liệu đã có sẵn công thức trong $...$ hoặc $$...$$ thì giữ nguyên từng ký tự. Mỗi công thức viết trên một dòng, không xuống dòng bên trong $...$. Dùng \\frac, \\sqrt, ^, _, \\int_a^b, \\lim_{x\\to a}, \\sum, \\begin{pmatrix}...\\end{pmatrix}, \\begin{vmatrix}...\\end{vmatrix}, \\begin{cases}...\\end{cases}, \\overrightarrow{AB}, \\angle, \\perp, \\parallel, \\triangle, \\left|...\\right|, \\in, \\subset, \\cup, \\cap. Dấu đô la thường viết \\$. CHÉP ĐÚNG những gì nhìn thấy, tuyệt đối không tự sửa, rút gọn hay tính lại công thức. Công thức nào không chắc thì vẫn viết LaTeX tốt nhất có thể và liệt kê trong fm: [{tex,raw,note}] (tex = đúng chuỗi LaTeX đã dùng trong q hoặc o, raw = mô tả cách công thức xuất hiện trong tài liệu, note = chỗ không chắc); không có công thức đáng ngờ thì bỏ fm. Chỉ trả JSON.';
    const PB='Bạn là công cụ trích xuất BẢNG ĐÁP ÁN và LỜI GIẢI từ tài liệu thi. Chỉ tìm các phần đáp án hoặc lời giải (bảng đáp án, mục «Đáp án», «Lời giải», «Hướng dẫn giải»), KHÔNG trích đề bài. Trả về DUY NHẤT một JSON dạng {keys:[{n,a,e,kind,full,raw}]}. n = số câu có nhãn rõ ràng (ô «Câu 19», «19.», cột số câu trong bảng); bỏ qua số trang, số thứ tự phương án, số trong công thức. Nếu lời giải nhắc lại «Câu 19» thì đó là tiêu đề lời giải của câu 19, không phải câu mới. kind = table (bảng hoặc danh sách đáp án chính thức) hoặc solution (nằm trong lời giải chi tiết). full = true CHỈ khi a là đáp án cuối cùng của TOÀN BỘ câu (đủ mọi ý, mọi vị trí); nếu lời giải chỉ nêu một ý, một cặp ghép, một phép tính hay kết quả trung gian thì full = false. a = đáp án như viết trong tài liệu: trắc nghiệm là ký hiệu phương án, có thể kèm nội dung như «C (√2+1)»; nhiều đáp án là «A, C»; đúng/sai là mảng Đ hoặc S theo thứ tự ý (nếu lời giải chỉ nói về một ý thì ghi đúng như viết, ví dụ «Phát biểu 2 Sai»); điền số là số; ghép nối là các cặp «1: 6 | 2: 4 | 3: 2» (số trước dấu hai chấm là vị trí [n], số sau là số thứ tự phương án từ 1 đến 6; ghi đúng nguyên văn kể cả khi số có vẻ bất thường như 12 hoặc 75, tuyệt đối không tự sửa). e = lời giải đầy đủ nếu có, không thì null. raw = nguyên văn đoạn chứa đáp án. Không bịa thêm mục. TUYỆT ĐỐI không đoán hay tự giải; không thấy rõ thì bỏ qua mục đó. CÔNG THỨC TOÁN trong e và a: viết bằng LaTeX trong $...$ (nội dòng) hoặc $$...$$ (riêng một dòng), mỗi công thức trên một dòng, giữ nguyên nếu tài liệu đã có sẵn $...$, chép đúng, không tự sửa hay tính lại. Chỉ trả JSON.';

    function qchk(n,sl){const r=[];

    function docxMath(xml,nm){let d;try{d=new DOMParser().parseFromString(xml,'application/xml');if(d.getElementsByTagName('parsererror').length)throw 0}
    catch(e){IW.push(nm+': không phân tích được cấu trúc Word nên chỉ đọc được chữ thuần, công thức có thể bị mất; hãy xuất file sang PDF rồi tải PDF lên');return docxLegacy(xml)}
    const W={n:0,bad:0},ps=Array.from(d.getElementsByTagName('w:p')).map(p=>wp(p,W,nm)).filter(s=>s.trim());
    if(W.n)IW.push(nm+': đã chuyển '+W.n+' công thức Word (OMML) sang LaTeX'+(W.bad?', trong đó '+W.bad+' công thức có cấu trúc chưa hỗ trợ (xem ghi chú ở mục Công thức)':'')+'; hãy đối chiếu với tài liệu gốc');
    if(!W.n&&/<m:t[ >]/.test(xml))IW.push(nm+': có công thức Word nhưng không chuyển được, hãy xuất file sang PDF rồi tải PDF lên');
    return ps.join('\n')}
    /* ---- hiển thị công thức (MathJax SVG: không cần CSS/phông ngoài) ---- */
    function loadMJ(){if(window.MathJax&&window.MathJax.tex2svg)return Promise.resolve();if(MJP)return MJP;
    window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},svg:{fontCache:'none',displayAlign:'left'},options:{enableMenu:false,enableAssistiveMml:false,skipHtmlTags:['script','noscript','style','textarea','pre','code','input']},startup:{typeset:false}};
    MJP=lj(MJU[0]).catch(()=>lj(MJU[1])).then(()=>MathJax.startup.promise).catch(e=>{MJP=null;throw e});return MJP}
    async function mj(el){el=el||A;if(!/\$|\\[(\[]/.test(el.textContent))return;const tk=++MJT;
    try{await loadMJ();if(el===A&&tk!==MJT)return;MathJax.typesetClear([el]);await MathJax.typesetPromise([el])}
    catch(e){if(el===A&&!document.getElementById('mjw'))A.insertAdjacentHTML('afterbegin','<p id="mjw" class="m">Không hiển thị được công thức (thư viện chưa tải được); công thức đang hiện dưới dạng mã LaTeX.</p>')}}
    /* ---- siêu dữ liệu, bảng kiểm tra công thức ---- */
    function mark(x,o,e){const src=x.lab;[x.q,...o,e].forEach(t=>fmx(flat(t||'')).forEach(f=>{if(!FMETA[f.tex])FMETA[f.tex]={st:'ai',src}}));
    (x.fm||[]).forEach(f=>{if(f&&f.tex)FMETA[String(f.tex).replace(/^\$+|\$+$/g,'').trim()]={st:'unsure',raw:f.raw||null,note:f.note||'AI không chắc chắn',src}})}
    function locate(text){const out=[];let pos=0,qi=1;
    text.split('\n').forEach(l=>{if(/^\s*---+\s*$/.test(l)){qi++}else{const t=l.trim();let fld='đề',m;
    if(/^(?:giải thích|giai thich)\s*[:：]/i.test(t))fld='lời giải';else if(/^(?:đáp án|dap an)\s*[:：]/i.test(t))fld='đáp án';else if(/^(?:lựa chọn|lua chon)\s*[:：]/i.test(t))fld='danh sách phương án';
    else if(m=/^([A-F])[.)]\s/.exec(t))fld='phương án '+m[1];else if(m=/^([a-d])\)\s/.exec(t))fld='ý '+m[1];
    fmx(l).forEach(f=>out.push({...f,s:pos+f.s,e:pos+f.e,qi,fld}))}pos+=l.length+1});return out}
    const ST={ai:'AI đọc',docx:'chuyển từ Word',unsure:'⚠ AI không chắc',edited:'đã sửa tay',user:'nhập tay'};
    function du(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
    async function srcp(){const b=document.getElementById('src');if(!b)return;if(!SRC.length){b.innerHTML='';return}
    for(const s of SRC)if(!s.u)s.u=await Promise.all(s.b.map(du));
    b.innerHTML='<details><summary>Đối chiếu trang/ảnh gốc đã gửi cho Claude ('+SRC.length+' phần)</summary>'+SRC.map(s=>'<p class="m">'+esc(s.lab)+'</p>'+s.u.map(u=>'<img alt="" src="'+u+'" style="max-width:100%;border:1px solid var(--bd);margin:4px 0">').join('')).join('')+'</details>'}
    async function fpanel(){const ta=document.getElementById('f-q'),box=document.getElementById('fp');if(!ta||!box)return;const F=locate(ta.value);
    box.innerHTML=F.length?F.map((f,k)=>{const mt=FMETA[f.tex]||{st:'user'},ln=texLint(f.tex),src=QL[f.qi-1]||mt.src||'';
    return '<div class="c fx"><p class="m"><b>Câu '+f.qi+' · '+f.fld+'</b> · '+(ST[mt.st]||mt.st)+(src?' · nguồn: '+esc(src):'')+'</p><div class="mth">'+(f.disp?'$$':'$')+esc(f.tex)+(f.disp?'$$':'$')+'</div><input class="fxi" data-k="'+k+'" value="'+esc(f.tex)+'" spellcheck="false">'
    +(mt.note?'<p class="m re">⚠ '+esc(mt.note)+'</p>':'')+(mt.raw?'<p class="m">Nhận diện ban đầu: '+esc(mt.raw)+'</p>':'')+'<p class="m re ferr">'+(ln.length?'✗ '+esc(ln.join('; ')):'')+'</p></div>'}).join(''):'<p class="m">Chưa có công thức nào trong bản nháp.</p>';
    await mj(box);
    box.querySelectorAll('.fx').forEach(d=>{const er=d.querySelector('.mth [data-mjx-error]');if(er){d.querySelector('.ferr').textContent='✗ Lỗi hiển thị: '+(er.getAttribute('data-mjx-error')||'cú pháp LaTeX không hợp lệ');d.style.borderColor='var(--no)'}});
    await srcp()}
    function fedit(k,v){const ta=document.getElementById('f-q'),f=locate(ta.value)[k];if(!f)return;v=v.replace(/\s*\n\s*/g,' ').trim();if(!v||v===f.tex)return;
    const old=FMETA[f.tex]||{};FMETA[v]={...old,st:'edited',raw:old.raw||f.tex,note:null};
    ta.value=ta.value.slice(0,f.s)+f.o+v+f.c+ta.value.slice(f.e);fpanel()}
    async function fcheck(qs){const errs=[],prev={};try{ex(view.id).qs.forEach(q=>(q.fm||[]).forEach(f=>{prev[f.tex]=f}))}catch(e){}
    const has=qs.some(q=>fmx([q.q,...(q.o||[]),q.e||''].join('\n')).length);let ok=false;
    if(has){try{await loadMJ();ok=true}catch(e){}}
    qs.forEach((q,i)=>{const seen=[];[[q.q,'đề'],...(q.o||[]).map((o,j)=>[o,'phương án '+(j+1)]),[q.e||'','lời giải']].forEach(([t,fld])=>fmx(t).forEach(f=>{
    let msg=texLint(f.tex)[0];
    if(!msg&&ok){try{const nd=MathJax.tex2svg(f.tex,{display:f.disp}),er=nd.querySelector('[data-mjx-error]');if(er)msg=er.getAttribute('data-mjx-error')||'cú pháp không hợp lệ'}catch(e){msg=e.message}}
    if(msg)errs.push('Câu '+(i+1)+' ('+fld+'): “'+f.tex.slice(0,60)+'” — '+msg);
    if(!seen.includes(f.tex))seen.push(f.tex)}));
    q.fm=seen.map(tex=>{const mt=FMETA[tex]||prev[tex]||{st:'user'};return{tex,st:mt.st,raw:mt.raw||null,src:mt.src||null,warn:mt.note||mt.warn||null,chk:ok?'đã render':'đã lint'}})});
    if(has&&!ok)errs.push('Không kiểm tra được cách hiển thị công thức vì thư viện hiển thị chưa tải được; hãy thử lại sau');
    return errs}
    async function imp(){const ms=document.getElementById('im'),fs=[...document.getElementById('fi').files];if(!fs.length){ms.textContent='Hãy chọn file trước.';return}
    IW=[];RV=[];FMETA={};SRC=[];QL=[];const jobs=[],ib=[],R=[],rg=(a,b)=>a===b?a:a+'–'+b;
    try{const sm=await claude.use('sample');if(!sm)throw new Error('Chức năng đọc đề chưa sẵn sàng trên trang này');
    for(const f of fs){const nm=f.name.toLowerCase();
    if(nm.endsWith('.docx')){ms.textContent='Đang đọc '+f.name+'…';const cs=chunk(await docxText(f));cs.forEach((t,i)=>jobs.push({text:t,lab:'đoạn '+(i+1)+'/'+cs.length+' của '+f.name}))}
    else if(nm.endsWith('.pdf')){ms.textContent='Đang chuyển '+f.name+' thành ảnh…';const im=await pdfImgs(f);for(let i=0;i<im.length;i+=3){const lb='trang '+rg(i+1,Math.min(i+3,im.length))+' của '+f.name,bl=im.slice(i,i+3);jobs.push({imgs:bl,lab:lb});SRC.push({lab:lb,b:bl})}}
    else if(/\.(png|jpe?g)$/.test(nm))ib.push(f);
    else throw new Error(f.name+': chưa hỗ trợ định dạng này (file .doc cũ hãy lưu lại thành .docx)')}
    for(let i=0;i<ib.length;i+=3){const lb='ảnh '+rg(i+1,Math.min(i+3,ib.length)),bl=ib.slice(i,i+3);jobs.push({imgs:bl,lab:lb});SRC.push({lab:lb,b:bl})}
    if(!jobs.length)throw new Error('Không có nội dung để đọc');
    if(jobs.some(j=>j.imgs)){const l=await sm.limits();if(!l||!l.images)throw new Error('Chế độ hiện tại chưa đọc được ảnh hoặc PDF')}
    const run=(p,j)=>sm.json(p+(j.text?'\n\nTÀI LIỆU:\n'+j.text:'\n\nTài liệu là các ảnh đính kèm, theo thứ tự trang.'),j.imgs?{images:j.imgs}:{});
    for(let i=0;i<jobs.length;i++){const j=jobs[i],r={lab:j.lab,qs:[],keys:[]};
    for(const [p,w] of [[PQ,'câu hỏi'],[PB,'đáp án']]){ms.textContent='Claude đang đọc '+w+', phần '+(i+1)+'/'+jobs.length+'…';
    try{const x=await run(p,j);if(w==='câu hỏi')r.qs=x.qs||[];else r.keys=x.keys||[]}
    catch(e){IW.push('Phần '+(i+1)+'/'+jobs.length+' ('+j.lab+'): không đọc được '+w+' ('+(e.message||e.code||e)+'), chưa nhập được nội dung này')}}
    R.push(r)}
    document.getElementById('f-q').value=draft(R);const t=document.getElementById('f-t');if(!t.value.trim())t.value=fs[0].name.replace(/\.[^.]+$/,'');
    ms.textContent='Xong. Hãy đọc lại toàn bộ bản nháp bên dưới rồi mới bấm Lưu & đăng.'}
    catch(e){ms.textContent='Lỗi: '+(e.message||e.code||e)}
    document.getElementById('iw').innerHTML=(RV.length?panel():'')+(IW.length?'<p><b>Cảnh báo chung:</b></p>'+IW.map(w=>'<p class="m">⚠ '+esc(w)+'</p>').join(''):'');fpanel()}
    async function save(){const g=i=>document.getElementById(i).value,m=document.getElementById('msg');let qs;
    try{qs=parse(g('f-q'));if(!qs.length)throw new Error('Chưa có câu hỏi nào')}catch(e){m.textContent=e.message;return}
    const mi=parseInt(g('f-m'));if(!g('f-t').trim()||!(mi>0)){m.textContent='Cần nhập tên đề và thời gian (phút)';return}
    m.textContent='Đang kiểm tra công thức…';const fe=await fcheck(qs);if(fe.length){m.textContent='Chưa đăng được: '+fe.length+' lỗi công thức. '+fe.slice(0,4).join(' | ');fpanel();return}
    const o={id:view.id||'e'+Date.now().toString(36),title:g('f-t').trim(),desc:g('f-d').trim(),minutes:mi,qs},i=D.exams.findIndex(z=>z.id===o.id);if(i<0)D.exams.push(o);else D.exams[i]=o;await publish()}
    A.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a,i=b.dataset.i,a=view.at;
    if(k==='home')go({n:'home'});else if(k==='new')go({n:'edit'});else if(k==='edit')go({n:'edit',id:i});else if(k==='save')save();else if(k==='imp')imp();else if(k==='fchk')fpanel();
    else if(k==='del'){if(armed===i){D.exams=D.exams.filter(x=>x.id!==i);armed=null;render();publish()}else{armed=i;render()}}
    else if(k==='start')start(i);
    else{if(k==='pick'){a.ans[a.cur]=+i}else if(k==='tf'){const q=ex(view.id).qs[a.cur],f=a.ans[a.cur]||Array(q.o.length).fill(null);f[+i]=b.dataset.v==='1';a.ans[a.cur]=f}else if(k==='ms'){const s0=new Set(a.ans[a.cur]||[]);if(s0.has(+i))s0.delete(+i);else s0.add(+i);a.ans[a.cur]=[...s0].sort((x,y)=>x-y)}else if(k==='chip'){sel=sel===+i?null:+i}else if(k==='slot'){place(+i);return}else if(k==='flag'){a.fl[a.cur]=!a.fl[a.cur]}
    else if(k==='prev'||k==='next'||k==='jump'){lap(a);sel=null;a.cur=k==='jump'?+i:a.cur+(k==='next'?1:-1)}
    else if(k==='sub'){view.cf=true}else if(k==='no'){view.cf=false}else if(k==='yes'){return finish()}
    st.set('a:'+view.id,a);render()}});
    A.addEventListener('input',e=>{if(e.target.id==='nm'){view.at.ans[view.at.cur]=e.target.value;st.set('a:'+view.id,view.at)}});
    A.addEventListener('dragstart',e=>{const b=e.target.closest('[data-a="chip"]');if(b){sel=+b.dataset.i;e.dataTransfer.setData('text/plain','x')}});
    A.addEventListener('dragover',e=>{if(e.target.closest('[data-a="slot"]'))e.preventDefault()});
    A.addEventListener('drop',e=>{const s=e.target.closest('[data-a="slot"]');if(s){e.preventDefault();place(+s.dataset.i)}});
    A.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('fxi'))fedit(+t.dataset.k,t.value)});
    render();
    (async()=>{try{const u=window.claude&&await claude.use('user');me=!!(u&&u.isOwner())}catch(e){}if(view.n==='home')render()})();
    </script></body></html>
